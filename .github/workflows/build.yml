name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.7.2'

      - name: Install dependencies
        run: dart pub get

      - name: Compile EXE
        run: dart compile exe bin/print_helper.dart -o build/print_helper.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: print_helper_windows
          path: build/print_helper.exe
          retention-days: 30
