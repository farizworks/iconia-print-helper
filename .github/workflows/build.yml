name: Build Windows EXE

on:
  push:
    tags: ['v*']          # push v1.0.0, v1.1.0… → builds and publishes a Release
  workflow_dispatch: {}   # also runnable manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write     # REQUIRED so the workflow can create the Release
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Compile EXE
        run: dart compile exe bin/print_helper.dart -o iconia_print_helper.exe

      # Always upload an artifact (handy for manual / non-tag runs).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: iconia_print_helper_windows
          path: iconia_print_helper.exe
          retention-days: 30

      # On a v* tag, attach the exe to a GitHub Release (created if missing).
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: iconia_print_helper.exe
